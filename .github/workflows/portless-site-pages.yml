name: Portless website

on:
  push:
    branches: [main]
    paths:
      - "portless-site/**"
      - ".github/workflows/portless-site-pages.yml"
  pull_request:
    paths:
      - "portless-site/**"
      - ".github/workflows/portless-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_EARLY_ACCESS_URL: ${{ vars.PORTLESS_EARLY_ACCESS_URL }}
      PUBLIC_GITHUB_URL: ${{ vars.PORTLESS_GITHUB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portless-site/package-lock.json

      - name: Install dependencies
        run: npm --prefix portless-site ci

      - name: Test site
        run: npm --prefix portless-site test

      - name: Build site
        run: npm --prefix portless-site run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: portless-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
