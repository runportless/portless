openapi: 3.1.0
info:
  title: Portless local control API
  version: 20.1.0
  description: >-
    Loopback-only API shared by the Portless CLI and embedded UI. Projects are
    reusable application topologies. Environments are independently configured
    and runnable instances. Public routes use readable project, environment,
    service, and artifact names; private ownership keys are never exposed.
    Authenticated native clients may send Portless-Client-Kind as `cli` or
    `mcp`; the daemon records that fixed actor category on durable operations.
    Browser sessions cannot claim a native client kind.
    Control routes are served only on portless.localhost and the supported
    loopback control hosts (localhost, 127.0.0.1, and ::1). On application
    hosts, /api/ and /auth/ paths are forwarded to the selected application,
    including paths that match this API or a Portless browser claim.
    The control API's browser security headers apply only on control hosts;
    application response policies are preserved without adding control policies.
servers:
  - url: http://portless.localhost/api/v1
security:
  - bearer: []
  - browserSession: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Daemon readiness
          content:
            application/json:
              schema:
                type: object
                required: [ready, apiVersion]
                properties:
                  ready: { type: boolean }
                  apiVersion: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', example: '20.1.0', description: Stable semantic API version. }
  /system:
    get:
      operationId: system
      responses:
        '200': { description: Local daemon metadata }
  /system/directories/select:
    post:
      operationId: selectSystemDirectory
      description: >-
        Opens the operating system's native directory chooser for an
        authenticated control-plane browser session. The optional initial path
        is used only when it names an existing absolute directory. Dismissing
        the chooser is a successful cancellation and returns no content.
      security:
        - browserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initialPath: { type: string, description: Optional existing absolute directory where the chooser should begin. }
      responses:
        '200':
          description: Selected directory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySelection' }
        '204': { description: The user dismissed the chooser without selecting a directory. }
        '403':
          description: A native bearer client attempted to open the browser-only chooser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /daemon:
    get:
      operationId: daemonStatus
      description: >-
        Browser-safe identity, lifecycle state, recovery state, and active
        environments for the local daemon. This shallow status does not probe
        supervisors, containers, or proxy ownership.
      responses:
        '200':
          description: Current daemon status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DaemonStatus' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /daemon/logs:
    get:
      operationId: daemonLogs
      description: >-
        Returns at most the latest 256 KiB from the fixed, private daemon log.
        The path is not client-selectable, unsafe files are rejected, and known
        installation authentication and ownership secrets are redacted before
        the snapshot crosses the API boundary.
      responses:
        '200':
          description: Bounded daemon-log tail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DaemonLogSnapshot' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /daemon/diagnostics:
    get:
      operationId: daemonDiagnostics
      description: >-
        Returns a bounded operational snapshot for the daemon drawer without
        performing the fail-closed runtime handoff audit. Storage inspection is
        opt-in so ordinary status views do not walk retained log directories.
      parameters:
        - in: query
          name: include
          schema: { type: string, enum: [storage] }
          description: Include storage footprint, configured retention limits, and pruning timestamps.
      responses:
        '200':
          description: Current daemon diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DaemonDiagnostics' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /daemon/handoff:
    get:
      operationId: daemonHandoffStatus
      description: >-
        Performs a fresh fail-closed audit of active supervisor, container,
        ingress, dependency-proxy, and ownership state. Clients request this
        only when presenting or attempting daemon replacement.
      responses:
        '200':
          description: Completed runtime handoff audit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DaemonHandoffStatus' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /daemon/restart:
    post:
      operationId: restartDaemon
      description: >-
        Requests an authenticated daemon replacement. Active environments must
        pass runtime handoff checks unless an authenticated browser session
        explicitly sends force after its fresh handoff audit reports blocked.
        A forced browser request still verifies the exact daemon instance and
        active-environment inventory, but may return handoff false when it
        bypasses the blocked adoption check. Browser sessions remain valid
        across the replacement. A successful response is a restart receipt
        with one shared five-second readiness deadline; clients reconnect by
        observing a different ready instanceId. Concurrent CLI, browser, MCP,
        and executable-change triggers coalesce into one replacement. A blocked
        ordinary handoff response identifies the environments responsible and
        provides stop-then-retry remediation commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceId]
              properties:
                instanceId: { type: string }
                force: { type: boolean, default: false, description: Browser-session-only recovery that permits replacement when a fresh runtime handoff audit is blocked. }
      responses:
        '202':
          description: Replacement accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DaemonRestart' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /relay:
    get:
      operationId: relayStatus
      description: Installation and end-to-end health of clean HTTP ingress and endpoint DNS.
      responses:
        '200':
          description: Current privileged relay status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelayStatus' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /runtime:
    get:
      operationId: runtimeStatus
      responses:
        '200':
          description: Docker/Podman selection and availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
    put:
      operationId: selectRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preference]
              properties:
                preference: { type: string, enum: [auto, docker, podman] }
      responses:
        '200':
          description: Persisted runtime preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runtime/start:
    post:
      operationId: startRuntime
      responses:
        '200': { description: Selected container runtime is ready }
        '503': { $ref: '#/components/responses/Unavailable' }
  /runtime/reset:
    get:
      operationId: planRuntimeReset
      description: Format-independent reset inventory derived from normalized runtime ownership rows. Remains available when the stored project topology requires reset-and-rediscover recovery.
      responses:
        '200':
          description: Counts, active environments, and topology compatibility needed to plan a guarded reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetPlan' }
    post:
      operationId: prepareRuntimeReset
      description: CLI-only runtime cleanup performed before application state is erased. Force permits active or unknown environments but never bypasses runtime ownership verification.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Verified supervisors and installation-owned container resources were stopped or removed.
        '403':
          description: Browser sessions cannot prepare a destructive runtime reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /browser-claims:
    post:
      operationId: createBrowserClaim
      description: CLI bearer authentication only; claims are single-use and short-lived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                next: { type: string, example: /environments/billing/local }
      responses:
        '201': { description: Browser claim URL and expiry }
  /session:
    get:
      operationId: session
      responses:
        '200': { description: Current CLI or browser principal and CSRF token }
  /session/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Browser session removed }
  /projects:
    get:
      operationId: listProjects
      description: With view=metadata returns ProjectMetadataList with offset pagination, safe counts and summaries.
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [metadata] }
        - in: query
          name: offset
          schema: { type: integer }
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Logical projects with environment summaries
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProjectMetadataList'
                  - type: object
                    required: [projects]
                    properties:
                      projects:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
    post:
      operationId: createProject
      description: Discover and combine one or more named source checkouts, then create the local environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sources]
              properties:
                requiredAssociationPath: { type: string, description: Creation must contain a discovered source associated with this absolute startup workspace; checked before persistence. }
                name: { $ref: '#/components/schemas/ProjectName' }
                sources:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201': { description: Project, initial environment, and discovery warnings }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/discover:
    post:
      operationId: discoverProject
      description: Authenticated native single-checkout discovery used by bare `portless up` and MCP configuration. MCP must supply allowedRoot. Discovery is static and read-only; it persists a stopped environment and never starts services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                allowedRoot: { type: string, description: Absolute canonical authorization root. MCP discovery uses confined directory handles and cannot inspect ancestors outside it. }
                requiredAssociationPath: { type: string, description: Require workspace association before creating a project. }
                requiredProject: { type: string, description: Require this public project name for both existing and newly discovered projects. }
                path: { type: string, description: Absolute checkout path from the CLI process. }
                name: { $ref: '#/components/schemas/ProjectName' }
      responses:
        '200': { description: Existing or newly created project and local environment }
  /projects/{projectName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
    get:
      operationId: getProject
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [metadata] }
      description: With view=metadata returns ProjectMetadata without discovered commands, environment values or runtime credentials.
      responses:
        '200':
          description: Logical topology and environment summaries
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Project'
                  - $ref: '#/components/schemas/ProjectMetadata'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: renameProject
      parameters:
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, revision]
              properties:
                name: { $ref: '#/components/schemas/ProjectName' }
                revision: { type: integer, format: int64 }
      responses:
        '200': { description: Renamed project; all environments must be stopped }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: forgetProject
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200':
          description: Preview of affected environments and retained artifacts when mode=preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationPreview' }
        '204': { description: Stopped project and all environment metadata forgotten }
  /projects/{projectName}/declaration:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
    get:
      operationId: exportProjectDeclaration
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [chunk] }
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expectedRevision
          schema: { type: integer }
        - in: query
          name: expectedCreatedAt
          schema: { type: string }
      description: Exports a safe schema-2 declaration with explicit redactions. view=chunk returns identity-bound UTF-8 TextRange pages; continuation requires expectedRevision and expectedCreatedAt.
      responses:
        '200':
          description: Safe schema-2 declaration, or its next UTF-8 range when view=chunk
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [schemaVersion, project, revision, createdAt, redactions]
                    properties:
                      schemaVersion: { type: integer, enum: [2] }
                      project: { $ref: '#/components/schemas/ProjectName' }
                      revision: { type: integer, minimum: 1 }
                      createdAt: { type: string, format: date-time }
                      redactions: { type: array, items: { type: string } }
                  - $ref: '#/components/schemas/ProjectDeclarationChunk'
        '409': { description: Project identity or declaration revision changed since the previous range }
  /projects/{projectName}/sources:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
    post:
      operationId: addProjectSource
      description: >-
        Discovers a local source directory, adds it to the logical project, and binds its absolute
        path only to the selected environment. Every environment in the project must be stopped;
        other environments remain unbound until configured explicitly. Available to authenticated
        CLI and browser clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, path, environment]
              properties:
                allowedRoot: { type: string, description: Absolute canonical authorization root; required for MCP source introduction. }
                name: { $ref: '#/components/schemas/SourceName' }
                path: { type: string, description: Absolute source path on the daemon host. }
                environment: { $ref: '#/components/schemas/EnvironmentName' }
      responses:
        '201': { description: Updated project, selected environment, discovery warnings, and environment selectors requiring configuration }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectName}/sources/{sourceName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/SourceName' }
    delete:
      operationId: deleteProjectSource
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      description: >-
        Removes a logical source from the project and atomically recompiles every environment.
        Every project environment must be stopped. Services owned by the source and resources
        used only by those services are removed and affected fault rules are disabled.
        Removal is rejected while mock scenario routes reference a removed service.
        A project must retain at least one source.
      responses:
        '200':
          description: Updated project and environments with the removed services and connections
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProjectSourceDeletion'
                  - $ref: '#/components/schemas/ConfigurationPreview'
        '400':
          description: The source is the project's final remaining source or the request is otherwise invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments:
    get:
      operationId: listEnvironments
      parameters:
        - in: query
          name: project
          schema: { $ref: '#/components/schemas/ProjectName' }
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Environments across all projects or one filtered project, including the same service.mock activity context as individual environment inspection for full and partial mocks.
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items: { $ref: '#/components/schemas/Environment' }
    post:
      operationId: cloneEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name]
              properties:
                project: { $ref: '#/components/schemas/ProjectName' }
                name: { $ref: '#/components/schemas/EnvironmentName' }
                from: { $ref: '#/components/schemas/EnvironmentName', default: local }
      responses:
        '201':
          description: New stopped environment with copied source and provider configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
  /environments/resolve:
    get:
      operationId: resolveEnvironmentForPath
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, description: Absolute checkout path. }
      responses:
        '200': { description: Selected environment, or all environments containing the checkout }
  /environments/context:
    get:
      operationId: getEnvironmentContextForPath
      description: Resolves the effective environment for a checkout and explains whether it was saved, inferred, ambiguous, or absent.
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, description: Absolute checkout path. }
      responses:
        '200':
          description: Effective environment context for the checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentContext' }
  /environments/select:
    put:
      operationId: selectEnvironmentForPath
      description: >-
        Selects an environment from a checkout belonging to its project. The
        selection survives automatic worktree preparation during startup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, project, environment]
              properties:
                path: { type: string, description: Absolute checkout path. }
                project: { $ref: '#/components/schemas/ProjectName' }
                environment: { $ref: '#/components/schemas/EnvironmentName' }
      responses:
        '204': { description: Checkout context selection persisted }
    delete:
      operationId: clearEnvironmentSelectionForPath
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, description: Absolute checkout path. }
      responses:
        '200':
          description: Whether a saved checkout selection was removed
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean }
  /environments/{projectName}/{environmentName}:
    parameters: &environmentParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
    get:
      operationId: getEnvironment
      responses:
        '200':
          description: Effective sources, providers, topology, and runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: forgetEnvironment
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200':
          description: Preview of affected configuration and retained artifacts when mode=preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationPreview' }
        '204': { description: Stopped environment metadata forgotten }
  /environments/{projectName}/{environmentName}/rescan:
    parameters: *environmentParameters
    post:
      operationId: rescanEnvironment
      parameters:
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200': { description: Refreshed all source discovery and recompiled topology }
  /environments/{projectName}/{environmentName}/up:
    parameters: *environmentParameters
    post:
      operationId: up
      description: >-
        Starts the environment and automatically prepares independent Git
        worktrees for local sources already used by another environment. Current
        files and installed local dependencies are copied, nested source paths
        are preserved, and the resulting bindings are persisted for reuse.
        Preparation is part of the durable operation and requires a committed
        Git checkout without nested repositories. It never relocates an active
        or unverified local runtime. Non-Git sources require a separate checkout
        or stopping the other environment. Existing request and response shapes
        are unchanged.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                debugServices: { type: array, items: { $ref: '#/components/schemas/ServiceName' } }
                managed: { type: boolean, default: false }
      responses:
        '202':
          description: Durable startup operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/down:
    parameters: *environmentParameters
    post:
      operationId: down
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                removeVolumes: { type: boolean, default: false }
      responses:
        '202':
          description: Durable shutdown operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/bindings/{serviceName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/ServiceName' }
    put:
      operationId: changeComponentProvider
      description: Changes one service provider. A stopped environment is reconfigured immediately; an active environment performs a service-scoped handoff while unrelated services remain running. The service field, if present, is replaced by the path service name.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentBinding' }
      responses:
        '202':
          description: Durable provider-change operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/sources/{sourceName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/SourceName' }
    put:
      operationId: setEnvironmentSourceCheckout
      description: Configures or replaces a checkout and recompiles the stopped environment without changing the project source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                allowedRoot: { type: string, description: Canonical confined discovery root required for MCP source changes. }
                path: { type: string, description: Absolute checkout or worktree path. }
      responses:
        '200': { description: Recompiled environment and discovery warnings }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeEnvironmentSourceCheckout
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      description: >-
        Removes only this environment's checkout while retaining the project source and every
        other environment. The environment must be stopped and no Checkout provider may still
        reference the source.
      responses:
        '200':
          description: Recompiled environment without the checkout, or ConfigurationPreview when mode=preview
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EnvironmentMutation'
                  - $ref: '#/components/schemas/ConfigurationPreview'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services:
    parameters: *environmentParameters
    get:
      operationId: listServices
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Effective service runtime snapshots
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services: { type: array, items: { $ref: '#/components/schemas/Service' } }
  /environments/{projectName}/{environmentName}/services/{serviceName}:
    parameters: &serviceParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/ServiceName' }
    get:
      operationId: getService
      responses:
        '200':
          description: Service runtime snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/start:
    parameters: *serviceParameters
    post:
      operationId: startService
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Idempotent service-start operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/stop:
    parameters: *serviceParameters
    post:
      operationId: stopService
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Idempotent service-stop operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/restart:
    parameters: *serviceParameters
    post:
      operationId: restartService
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Service-restart operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/manage:
    parameters: *serviceParameters
    post:
      operationId: manageService
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Service restart in normal managed mode accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/debug:
    parameters: *serviceParameters
    post:
      operationId: debugService
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Service restart with its discovered debugger enabled accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/services/{serviceName}/configuration:
    parameters: *serviceParameters
    get:
      operationId: serviceConfiguration
      responses:
        '200':
          description: Effective configuration with sensitive values masked and generated connection values identified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceConfiguration' }
  /environments/{projectName}/{environmentName}/connections:
    parameters: *environmentParameters
    get:
      operationId: listConnections
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Effective source/target edges, proxy addresses, providers, and injected values
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: { type: array, items: { $ref: '#/components/schemas/EffectiveConnection' } }
  /environments/{projectName}/{environmentName}/connections/{sourceName}/{targetName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: sourceName
        required: true
        schema: { type: string }
      - in: path
        name: targetName
        required: true
        schema: { $ref: '#/components/schemas/ServiceName' }
    get:
      operationId: getConnection
      responses:
        '200':
          description: One effective directed connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveConnection' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{projectName}/{environmentName}/logs:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: query
        name: service
        schema: { $ref: '#/components/schemas/ServiceName' }
        description: Omit to merge entries from every service.
    get:
      operationId: serviceLogs
      parameters:
        - { $ref: '#/components/parameters/LogLimit' }
        - in: query
          name: since
          description: Go duration such as 10m, or an RFC3339 timestamp.
          schema: { type: string }
      responses:
        '200':
          description: Chronological structured log entries from retained process and container generations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogEntries' }
  /environments/{projectName}/{environmentName}/traffic:
    parameters: *environmentParameters
    delete:
      operationId: clearTraffic
      parameters:
        - in: query
          name: throughSequence
          schema: { type: integer, minimum: 0 }
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      description: Clears the live exchange buffer and derived traces, and disposes originating replay workspace payloads. Preview returns TrafficClearPreview. MCP apply requires throughSequence and the unchanged environment/daemon ResourceVersion. Only completed exchanges through this watermark are evicted; newer traffic and recordings remain. Admitted replay receipts remain until idle cleanup. Does not reset sequence numbers.
      responses:
        '200':
          description: Live traffic was cleared through the reported environment-local sequence.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TrafficClearResponse'
                  - $ref: '#/components/schemas/TrafficClearPreview'
  /environments/{projectName}/{environmentName}/traffic/replays:
    parameters: *environmentParameters
    post:
      operationId: prepareTrafficReplay
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
      description: Freeze one ordinary HTTP exchange from the live traffic window. Exact sequence and startedAt must match; recordings are not a fallback. Preparation sends no application requests and does not probe or start services. Replay routes accept authenticated browser/CLI clients. An MCP bearer client must also send Portless-MCP-Replay-Capability with value 1; missing or invalid declarations are rejected. All responses use Cache-Control no-store. JSON input is bounded to 1 MiB and rejects unknown fields and trailing data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareTrafficReplayRequest' }
      responses:
        '201':
          description: Frozen baseline and initial safe draft. PUT a complete draft before sending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficReplayWorkspace' }
        '400': { description: Unsupported exchange or invalid input }
        '403': { description: Caller lacks replay capability }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Original exchange start time no longer matches }
        '413': { description: Input or captured observation exceeds replay limits }
        '429': { description: Workspace or memory capacity reached }
  /environments/{projectName}/{environmentName}/traffic/replays/{replayNumber}:
    parameters: &replayParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: replayNumber
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getTrafficReplay
      description: Inspect metadata without sending traffic. Clients following a receipt must supply both expected timestamps. With neither timestamp, inspect a number explicitly selected in the current daemon. Metadata omits baseline, draft, and result payloads. Disposed workspaces return retained receipts without payloads until idle cleanup. Inspection and background polling do not renew the idle timeout.
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
        - in: query
          name: expectedCreatedAt
          schema: { type: string, format: date-time }
        - in: query
          name: expectedDaemonStartedAt
          schema: { type: string, format: date-time }
        - in: query
          name: include
          schema: { type: string, enum: [result] }
          description: Include frozen baseline, safe draft and latest result once needed; credentials remain redacted.
      responses:
        '200':
          description: Workspace metadata or full safe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficReplayWorkspace' }
        '400': { description: Invalid or partial expected identity }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Expired workspace or mismatched daemon/workspace identity }
    delete:
      operationId: deleteTrafficReplay
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
      description: Release workspace payloads and unused prepared credentials when the editor closes. Admitted requests continue independently; their compact receipts suppress duplicate sends for the remainder of the idle retention window. Completed results are not republished into a closed session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficReplayIdentity' }
      responses:
        '204': { description: Workspace payloads released }
        '410': { description: Expired workspace or mismatched identity }
  /environments/{projectName}/{environmentName}/traffic/replays/{replayNumber}/activity:
    parameters: *replayParameters
    post:
      operationId: touchTrafficReplay
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
      description: Record replay editor activity and renew the one-hour idle timeout for the matching open session. Requires both identity timestamps; a closed or inactive session cannot be revived. Does not alter the draft, retain prepared credentials longer, send application traffic, or emit lifecycle events. Browser clients batch actual keyboard, pointer, input and scroll activity at most once every 30 seconds; they do not send unconditional keepalives.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrafficReplayIdentity' }
      responses:
        '204': { description: Activity recorded }
        '400': { description: Invalid or missing identity }
        '403': { description: Authentication, CSRF or replay capability required }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Closed or inactive session, or mismatched identity }
  /environments/{projectName}/{environmentName}/traffic/replays/{replayNumber}/draft:
    parameters: *replayParameters
    put:
      operationId: updateTrafficReplayDraft
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
      description: Validate a complete request and snapshot the ready service's registered provider generation and current topology. Same-project environments only; original source and target are fixed. No application I/O. Successful preparation increments revision and retains runtime credential values for less than 60 seconds. Responses contain only redacted values. Requires optimistic revision and both identity timestamps. The decoded UTF-8 body is limited to 25 MiB; the JSON envelope allows 151 MiB for worst-case string escaping. Oversized bodies return a structured 413 replay_input_limit error without changing the prepared draft or dispatching a request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTrafficReplayDraftRequest' }
      responses:
        '200':
          description: Revised safe draft and reviewed public destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficReplayWorkspace' }
        '400': { description: Invalid, unsupported or unresolved request inputs }
        '403': { description: Remote policy blocks the selected method }
        '409': { description: Stale revision, active run or unavailable service edge }
        '410': { description: Expired workspace or mismatched identity }
        '413': { description: Request input exceeds a byte or row limit }
        '429': { description: Replay memory capacity reached }
  /environments/{projectName}/{environmentName}/traffic/replays/{replayNumber}/runs:
    parameters: *replayParameters
    post:
      operationId: runTrafficReplay
      parameters:
        - { $ref: '#/components/parameters/MCPReplayCapability' }
      description: Admit one explicit request using the prepared revision, next run number and both identity timestamps. Revalidate the destination binding and proxy generation, enforce remote policy, and require reviewed confirmation for remote writes. Identical repeated admission arguments return that run's receipt without dispatching again; conflicting arguments fail. Runs continue independently of the initiating HTTP connection, with a 30-second deadline, 64 KiB retained response and 1 MiB consumption cap. No redirect following or automatic application retry. After a lost POST response, inspect the known workspace with GET instead of resending.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunTrafficReplayRequest' }
      responses:
        '202':
          description: Compact admission receipt, possibly already completed for a duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficReplayWorkspace' }
        '403': { description: Missing reviewed remote-write confirmation or blocked policy }
        '409': { description: Stale revision or destination, conflicting run, active run or expired preparation }
        '410': { description: Expired workspace or mismatched identity }
        '429': { description: Concurrent run, workspace run or aggregate capacity limit }
  /environments/{projectName}/{environmentName}/traffic/exchanges:
    parameters: *environmentParameters
    get:
      operationId: listTrafficExchanges
      parameters:
        - in: query
          name: protocol
          schema: { type: string, enum: [all, http, tcp], default: all }
          description: tcp includes opaque sessions and protocol-aware PostgreSQL, Redis/Valkey, MySQL, and NATS operations.
        - { $ref: '#/components/parameters/Limit1000' }
        - in: query
          name: service
          schema: { $ref: '#/components/schemas/ServiceName' }
          description: Match either endpoint.
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: target
          schema: { type: string }
        - in: query
          name: edge
          schema: { type: string, pattern: '^[^:]+:[^:]+$' }
          description: Directed source:target shorthand; overrides source and target.
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        '200':
          description: Newest-first bounded exchange summaries from the live buffer; HTTP headers/bodies and decoded TCP messages are available from the detail route.
          content:
            application/json:
              schema:
                type: object
                required: [exchanges]
                properties:
                  exchanges: { type: array, items: { $ref: '#/components/schemas/TrafficExchange' } }
  /environments/{projectName}/{environmentName}/traffic/exchanges/{sequence}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: sequence
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getTrafficExchange
      responses:
        '200':
          description: One complete traffic exchange from the live buffer or a retained recording
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficExchange' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{projectName}/{environmentName}/traffic/traces:
    parameters: *environmentParameters
    get:
      operationId: listTrafficTraces
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
        - in: query
          name: service
          schema: { $ref: '#/components/schemas/ServiceName' }
          description: Match traces containing the service as either endpoint.
        - in: query
          name: edge
          schema: { type: string, pattern: '^[^:]+:[^:]+$' }
          description: Match traces containing this directed source:target edge.
        - in: query
          name: background
          schema: { type: string, enum: [exclude, include], default: exclude }
          description: Include browser subresource and successful connection-housekeeping traces.
      responses:
        '200':
          description: Newest-first cached trace summaries, filtered before limiting, with complete projection watermarks
          content:
            application/json:
              schema:
                type: object
                required: [traces, revision, throughSequence]
                properties:
                  traces: { type: array, items: { $ref: '#/components/schemas/TrafficTrace' } }
                  revision: { type: integer, format: int64, minimum: 0, description: Complete environment projection revision before filtering and limiting. Resets with the daemon. }
                  throughSequence: { type: integer, format: int64, minimum: 0, description: Complete exchange high-water mark represented by this projection, including empty results. }
  /environments/{projectName}/{environmentName}/traffic/traces/{number}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: number
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getTrafficTrace
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [page] }
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expectedRevision
          schema: { type: integer }
      description: view=page returns revision-bound trace metadata and a bounded span page. Continuation requires expectedRevision.
      responses:
        '200':
          description: One trace with its tree and waterfall span projection
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TrafficTrace'
                  - $ref: '#/components/schemas/TrafficTracePage'
        '409': { description: Trace projection changed since the previous page }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{projectName}/{environmentName}/stream:
    parameters: *environmentParameters
    get:
      operationId: environmentStream
      parameters:
        - in: query
          name: topic
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200': { description: text/event-stream; see portless-daemon/api/events.md }
  /environments/{projectName}/{environmentName}/mocks:
    parameters: *environmentParameters
    get:
      operationId: listMockScenarios
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [metadata] }
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: view=metadata returns paged scenario identity, activation and counts without loading saved bodies.
      responses:
        '200':
          description: Environment-scoped HTTP mock scenarios, service-scoped routes, and derived activation state
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MockScenarioList'
                  - $ref: '#/components/schemas/MockScenarioMetadataList'
    post:
      operationId: createMockScenario
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
      description: Creates an empty, disabled scenario. Services are selected on individual routes, not on the scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMockRequest' }
      responses:
        '201':
          description: Created scenario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockScenario' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}:
    parameters: &mockScenarioParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/MockScenarioName' }
    get:
      operationId: getMockScenario
      parameters:
        - in: query
          name: view
          schema: { type: string, enum: [metadata] }
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expectedModifiedAt
          schema: { type: string }
      description: view=metadata returns a page of route metadata. Continuation requires expectedModifiedAt to reject scenario edits.
      responses:
        '200':
          description: One mock scenario and its ordered routes
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MockScenario'
                  - $ref: '#/components/schemas/MockScenarioMetadataPage'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMockScenario
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      description: Deletes a disabled scenario and all of its routes. Enabled and degraded scenarios must be disabled first.
      responses:
        '200':
          description: Scenario identity, eligibility and removal effects when mode=preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockDeletionPreview' }
        '204': { description: Scenario deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/policy:
    parameters: *mockScenarioParameters
    put:
      operationId: setMockScenarioPolicy
      description: >-
        Switches full or partial mocking while preserving routes and enabled state.
        An enabled scenario is disabled, its policy saved, and then enabled again
        through the existing provider handoff workflow. A failed change attempts
        to restore the previous policy and enabled state. Degraded scenarios and
        environments in a lifecycle transition reject changes. Follow the durable
        operation to completion and inspect the current scenario after a failure.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMockScenarioPolicyRequest' }
      responses:
        '202':
          description: Mock policy operation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { description: Missing or invalid unmatched-request policy }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/activation:
    parameters: *mockScenarioParameters
    put:
      operationId: setMockScenarioActivation
      description: >-
        Enables or disables the whole scenario as one tracked operation. Enabling saves
        each target service's exact previous binding. Reject mode replaces the provider and
        restores it on disable; forward mode atomically attaches routes while preserving
        the real provider, process, debugger and WebSocket sessions. Target coverage includes disabled routes. Empty scenarios
        cannot be enabled, and enabled scenarios cannot overlap on a service. A partial
        transition is rolled back; if rollback fails, restoration records are retained and
        activation is degraded. Disable a degraded scenario to retry restoration.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetMockScenarioActivationRequest' }
      responses:
        '202':
          description: Durable scenario activation operation; inspect its terminal state for success or failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/routes/{routeName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/MockScenarioName' }
      - { $ref: '#/components/parameters/MockRouteName' }
    put:
      operationId: putMockRoute
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
      description: >-
        Creates or replaces one fixed-response route. Service is required. Ambiguity is
        checked only within the same service. While enabled, response edits and route
        toggles reload active runtimes, but edits must not change the set of target services.
        The request body name is required. If it differs from routeName, the addressed
        route must exist and is renamed atomically with the other edits. An existing
        destination name is rejected; creation time and scenario ownership are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockRoute' }
      responses:
        '200':
          description: Updated scenario; each active service matcher is swapped atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockScenario' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteMockRoute
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      description: Deleting the final route for an active target service requires disabling the scenario first.
      responses:
        '200':
          description: Updated scenario, or MockDeletionPreview when mode=preview
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/MockScenario'
                  - $ref: '#/components/schemas/MockDeletionPreview'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: getMockRoute
      description: Read one route metadata projection. includePayloads=true additionally returns a UTF-8 TextRange of JSON containing query matchers, response headers and body. Continuation requires expectedModifiedAt. Saved route payload reads are permission-gated by MCP.
      parameters:
        - in: query
          name: includePayloads
          schema: { type: boolean, default: false }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 131072, default: 32768 }
        - in: query
          name: expectedModifiedAt
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Route metadata and optional payload range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockRouteDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/preview:
    parameters: *mockScenarioParameters
    post:
      operationId: previewMockRequest
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
      description: >-
        Evaluates a sample request against saved scenario routes and an optional
        in-memory route draft. The scenario may be disabled. An existing draft
        requires originalRoute; a new draft omits it and must have a unique name.
        The full temporary scenario is validated, disabled routes are skipped,
        and normal service/path/query precedence applies. No state is saved,
        provider changed, application contacted, delay awaited, or traffic,
        recording, event, or timeline history generated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewMockRequest' }
      responses:
        '200':
          description: Expected mock response with mock-owned headers, or structured unmatched 501 response; HTTP HEAD/204/304 body suppression applies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockPreview' }
        '400':
          description: Invalid envelope, sample request, draft, or ambiguous temporary scenario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/imports/recording:
    parameters: *mockScenarioParameters
    post:
      operationId: importMockScenarioRecording
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
      description: Appends deterministic routes from a stopped recording to a disabled scenario. Preserves each exchange's target service. Omit services to import all eligible HTTP services.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMockRecordingRequest' }
      responses:
        '200':
          description: Updated scenario and import warnings; routes are validated and saved as one batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockScenarioMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/mocks/{scenarioName}/imports/openapi:
    parameters: *mockScenarioParameters
    post:
      operationId: importMockScenarioOpenAPI
      parameters:
        - { $ref: '#/components/parameters/MockMetadata' }
      description: Appends deterministic routes from a local OpenAPI 3.0/3.1 document to a disabled scenario, assigning them to the explicitly selected service. External references are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMockOpenAPIRequest' }
      responses:
        '200':
          description: Updated scenario and import warnings; routes are validated and saved as one batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockScenarioMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{projectName}/{environmentName}/recordings:
    parameters: *environmentParameters
    get:
      operationId: listRecordings
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Environment recordings
          content:
            application/json:
              schema:
                type: object
                required: [recordings]
                properties:
                  recordings: { type: array, items: { $ref: '#/components/schemas/Recording' } }
    post:
      operationId: startRecording
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingInput' }
      responses:
        '201':
          description: Active bounded recording
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}:
    parameters: &recordingParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/RecordingName' }
    get:
      operationId: getRecording
      responses:
        '200':
          description: Recording metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
    delete:
      operationId: deleteRecording
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200':
          description: Recording identity, eligibility and removal effects when mode=preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingDeletionPreview' }
        '204': { description: Completed recording deleted }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}/stop:
    parameters: *recordingParameters
    post:
      operationId: stopRecording
      responses:
        '200':
          description: Completed recording
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}/export:
    parameters: *recordingParameters
    get:
      operationId: exportRecording
      responses:
        '200':
          description: Portless JSON recording export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingExport' }
  /environments/{projectName}/{environmentName}/faults:
    parameters: *environmentParameters
    get:
      operationId: listFaults
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Environment fault rules
          content:
            application/json:
              schema:
                type: object
                required: [faults]
                properties:
                  faults: { type: array, items: { $ref: '#/components/schemas/FaultRule' } }
    post:
      operationId: createFault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaultInput' }
      responses:
        '201':
          description: Enabled fault rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultRule' }
  /environments/{projectName}/{environmentName}/faults/{faultName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/FaultName' }
    get:
      operationId: getFault
      responses:
        '200':
          description: Fault rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultRule' }
    delete:
      operationId: deleteFault
      parameters:
        - { $ref: '#/components/parameters/MutationMode' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200':
          description: Fault identity, eligibility and removal effects when mode=preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultDeletionPreview' }
        '204': { description: Rule deleted; existing traffic and timeline history retained }
  /environments/{projectName}/{environmentName}/faults/disable-all:
    parameters: *environmentParameters
    post:
      operationId: disableAllFaults
      responses:
        '200': { description: Active rules disabled atomically }
  /environments/{projectName}/{environmentName}/operations:
    parameters: *environmentParameters
    get:
      operationId: listOperations
      parameters:
        - { $ref: '#/components/parameters/Limit500' }
      responses:
        '200':
          description: Newest-first environment operations
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
  /environments/{projectName}/{environmentName}/operations/{operationNumber}:
    parameters: &operationParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/OperationNumber' }
    get:
      operationId: getOperation
      responses:
        '200':
          description: Operation with events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /environments/{projectName}/{environmentName}/operations/{operationNumber}/events:
    parameters: *operationParameters
    get:
      operationId: operationEvents
      responses:
        '200':
          description: Ordered operation events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/OperationEvent' } }
  /environments/{projectName}/{environmentName}/timeline:
    parameters: *environmentParameters
    get:
      operationId: timeline
      parameters:
        - { $ref: '#/components/parameters/Limit1000' }
      responses:
        '200':
          description: Newest-first durable environment timeline
          content:
            application/json:
              schema:
                type: object
                required: [timeline]
                properties:
                  timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
  /environments/{projectName}/{environmentName}/traffic/replays/{replayNumber}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: replayNumber
        required: true
        schema: { type: integer, minimum: 1 }
      - { $ref: '#/components/parameters/MCPReplayCapability' }
    get:
      operationId: getTrafficReplayStatus
      description: Metadata-only workspace identity, revisions, every submitted destination and compact admission receipts. Never clones bodies or prepared credentials. Closed workspaces remain readable while receipts are retained.
      parameters:
        - in: query
          name: expectedCreatedAt
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: expectedDaemonStartedAt
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bounded replay status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficReplayStatus' }
        '403': { description: MCP capability missing or invalid }
        '409': { description: Workspace identity changed }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}/export/chunks:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/RecordingName' }
    get:
      operationId: getRecordingExportChunk
      description: Complete schema-5 export delivered in base64 chunks. First request freezes retained event count and sequence watermark; subsequent signed cursors bind recording/environment creation identities and a position within an event. Active recordings exclude later traffic. Name reuse, deletion or daemon restart invalidates the cursor. Reassemble bytes in order; complete is true only after the JSON suffix. The ordinary export endpoint streams this same complete iterator without the former 10000-event cutoff.
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: maxBytes
          schema: { type: integer, minimum: 1, maximum: 131072, default: 131072 }
      responses:
        '200':
          description: Lossless bounded export chunk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingExportChunk' }
        '400': { description: Invalid cursor or chunk size }
        '409': { description: Snapshot identity changed }
  /environments/{projectName}/{environmentName}/faults/{faultName}/enable:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/FaultName' }
    post:
      operationId: enableFault
      description: Enable an existing unexpired rule without extending its original expiry. MCP additionally requires an exact source-target edge, a finite expiry within one hour, and an atomic reviewed identity.
      parameters:
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '200':
          description: Enabled rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultRule' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { description: Missing MCP precondition }
  /environments/{projectName}/{environmentName}/faults/{faultName}/disable:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/FaultName' }
    post:
      operationId: disableFault
      responses:
        '204': { description: Rule disabled with history retained }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Mode-0600 installation secret used by the local CLI.
    browserSession:
      type: apiKey
      in: cookie
      name: portless_session
      description: SameSite=Strict browser session; mutations also require X-Portless-CSRF.
  parameters:
    MutationMode:
      in: query
      name: mode
      description: preview returns an exact identity and affected metadata without mutation; absent mode applies the mutation. MCP apply requires If-Match. Tool-layer apply additionally requires confirm=true.
      schema: { type: string, enum: [preview, apply] }
    ResourceIfMatch:
      in: header
      name: If-Match
      description: Quoted base64url encoding of ResourceVersion JSON from preview. Required for MCP guarded cleanup, rename, rescan and fault enable. The database checks creation identities, revisions and configuration stateDigest inside the committing transaction; stale identity returns 409 and missing identity 428.
      schema: { type: string, maxLength: 2048 }
    MCPReplayCapability:
      in: header
      name: Portless-MCP-Replay-Capability
      description: MCP native clients must declare the fixed replay contract version on every replay route. This opt-in declaration supplements bearer authentication and is not a credential. Browser/CLI authentication and remote write policy remain unchanged.
      schema: { type: string, enum: ['1'] }
    MockMetadata:
      in: header
      name: Portless-Mock-Metadata
      description: Value 1 requests compact metadata-only mock mutations and preview responses; stored body, response header values and query matcher values are omitted.
      schema: { type: string, enum: ['1'] }
    PortlessClientKind:
      in: header
      name: Portless-Client-Kind
      description: >-
        Optional authenticated native-client category. Accepted only with
        bearer authentication; browser sessions must not send this header.
      schema: { type: string, enum: [cli, mcp] }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: >-
        Optional stable key for a durable lifecycle request. Reusing a key with
        the same request returns the original operation; reusing it for a
        different request returns IDEMPOTENCY_CONFLICT.
      schema: { type: string, maxLength: 200 }
    ProjectName:
      in: path
      name: projectName
      required: true
      schema: { $ref: '#/components/schemas/ProjectName' }
    EnvironmentName:
      in: path
      name: environmentName
      required: true
      schema: { $ref: '#/components/schemas/EnvironmentName' }
    ServiceName:
      in: path
      name: serviceName
      required: true
      schema: { $ref: '#/components/schemas/ServiceName' }
    SourceName:
      in: path
      name: sourceName
      required: true
      schema: { $ref: '#/components/schemas/SourceName' }
    RecordingName:
      in: path
      name: recordingName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    FaultName:
      in: path
      name: faultName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    MockScenarioName:
      in: path
      name: scenarioName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    MockRouteName:
      in: path
      name: routeName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    OperationNumber:
      in: path
      name: operationNumber
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Limit1000:
      in: query
      name: limit
      description: Positive result bound; the endpoint applies its documented default when omitted.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    Limit500:
      in: query
      name: limit
      description: Positive result bound; defaults to 100.
      schema: { type: integer, minimum: 1, maximum: 500 }
    LogLimit:
      in: query
      name: limit
      description: Maximum newest matching entries to return; defaults to 500.
      schema: { type: integer, minimum: 1, maximum: 10000 }
  responses:
    Forbidden:
      description: Authenticated caller is not authorized for this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Named resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Name, revision, provider, or current-state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Required local runtime unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ProjectName: &dnsName
      type: string
      pattern: '^[a-z][a-z0-9-]{0,62}$'
      examples: [billing]
    EnvironmentName: *dnsName
    ServiceName: *dnsName
    SourceName: *dnsName
    ArtifactName:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
      examples: [checkout-debug]
    HTTPFinalStatusCode:
      type: integer
      description: Registered HTTP status code that completes a response; informational 1xx codes are not final responses.
      enum: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226, 300, 301, 302, 303, 304, 305, 307, 308, 400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 421, 422, 423, 424, 425, 426, 428, 429, 431, 451, 500, 501, 502, 503, 504, 505, 506, 507, 508, 510, 511]
    RuntimeStatus:
      type: object
      required: [preference, state, candidates]
      properties:
        preference: { type: string, enum: [auto, docker, podman] }
        selected: { type: string, enum: [docker, podman] }
        state: { type: string, enum: [ready, missing, failed] }
        version: { type: string }
        reason: { type: string }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
    ResetPlan:
      type: object
      required: [projects, environments, managedVolumeEnvironments, activeEnvironments, topologyIncompatible]
      properties:
        projects: { type: integer, minimum: 0 }
        environments: { type: integer, minimum: 0 }
        managedVolumeEnvironments: { type: integer, minimum: 0 }
        activeEnvironments: { type: array, items: { type: string, example: billing/local } }
        topologyIncompatible:
          type: boolean
          description: True when ordinary environment operations cannot decode the stored topology and active state requires an explicit forced reset.
    DaemonStatus:
      type: object
      required: [state, pid, startedAt, instanceId, buildId, protocolVersion, apiVersion, recoveryProblems, activeEnvironments]
      properties:
        state: { type: string, enum: [reconciling, ready, draining] }
        pid: { type: integer }
        startedAt: { type: string, format: date-time }
        instanceId: { type: string }
        buildId: { type: string }
        protocolVersion: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', example: '4.0.0', description: Stable semantic daemon protocol version. }
        apiVersion: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', example: '20.1.0', description: Stable semantic API version. }
        recoveryProblems: { type: array, items: { type: string } }
        activeEnvironments: { type: array, items: { type: string, example: billing/local } }
    DaemonDiagnostics:
      type: object
      required: [collectedAt, inventory, recovery, build]
      properties:
        collectedAt: { type: string, format: date-time }
        inventory: { $ref: '#/components/schemas/DaemonManagedInventory' }
        recovery: { $ref: '#/components/schemas/DaemonRecoveryStatus' }
        build: { $ref: '#/components/schemas/DaemonBuildProvenance' }
        lastRestart: { $ref: '#/components/schemas/DaemonRestartStatus' }
        storage: { $ref: '#/components/schemas/DaemonStorageStatus' }
    DaemonManagedInventory:
      type: object
      required: [processes, containers, proxyListeners, activeEnvironments, problems]
      properties:
        processes: { type: integer, minimum: 0 }
        containers: { type: integer, minimum: 0 }
        proxyListeners: { type: integer, minimum: 0 }
        activeEnvironments: { type: integer, minimum: 0 }
        problems: { type: array, items: { type: string } }
    DaemonRecoveryStatus:
      type: object
      required: [result, durationMs, recovered, problems]
      properties:
        result: { type: string, enum: [not-run, healthy, degraded, failed] }
        completedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        recovered: { type: integer, minimum: 0 }
        problems: { type: array, items: { type: string } }
    DaemonBuildProvenance:
      type: object
      required: [version, distribution, commit, runningBuildId, current]
      properties:
        version: { type: string, description: Semantic Portless release version or dev for a source build. }
        distribution: { type: string, example: homebrew }
        commit: { type: string, description: Source revision linked into the executable, or unknown when unavailable. }
        runningBuildId: { type: string, description: SHA-256 identity captured by the running daemon. }
        onDiskBuildId: { type: string, description: Current SHA-256 identity at the daemon executable's resolved path. }
        current: { type: boolean, description: Whether the running process matches the executable currently present on disk. }
        problem: { type: string }
    DaemonStorageStatus:
      type: object
      required:
        - databaseBytes
        - recordingCount
        - recordedEventCount
        - recordedBytes
        - liveTrafficExchanges
        - liveTrafficBytes
        - serviceLogBytes
        - daemonLogBytes
        - trafficExchangeLimitPerEnvironment
        - trafficPayloadLimitPerEnvironment
        - recordingDefaultEventLimit
        - recordingMaximumEventLimit
        - recordingDefaultPayloadLimit
        - recordingMaximumPayloadLimit
        - serviceLogGenerationLimit
        - serviceLogStreamLimitBytes
        - problems
      properties:
        databaseBytes: { type: integer, format: int64, minimum: 0, description: SQLite database, WAL, and shared-memory disk footprint. }
        recordingCount: { type: integer, format: int64, minimum: 0 }
        recordedEventCount: { type: integer, format: int64, minimum: 0 }
        recordedBytes: { type: integer, format: int64, minimum: 0, description: Encoded recording traffic bytes retained inside SQLite. }
        liveTrafficExchanges: { type: integer, minimum: 0 }
        liveTrafficBytes: { type: integer, format: int64, minimum: 0 }
        serviceLogBytes: { type: integer, format: int64, minimum: 0 }
        daemonLogBytes: { type: integer, format: int64, minimum: 0 }
        trafficExchangeLimitPerEnvironment: { type: integer, minimum: 1 }
        trafficPayloadLimitPerEnvironment: { type: integer, format: int64, minimum: 1 }
        recordingDefaultEventLimit: { type: integer, format: int64, minimum: 1 }
        recordingMaximumEventLimit: { type: integer, format: int64, minimum: 1 }
        recordingDefaultPayloadLimit: { type: integer, format: int64, minimum: 1 }
        recordingMaximumPayloadLimit: { type: integer, format: int64, minimum: 1 }
        serviceLogGenerationLimit: { type: integer, minimum: 1 }
        serviceLogStreamLimitBytes: { type: integer, format: int64, minimum: 1 }
        trafficPrunedAt: { type: string, format: date-time }
        serviceLogsPrunedAt: { type: string, format: date-time }
        problems: { type: array, items: { type: string } }
    DaemonLogSnapshot:
      type: object
      required: [content, truncated]
      properties:
        content:
          type: string
          description: Plain-text tail of the private daemon log after known installation-secret redaction.
        truncated:
          type: boolean
          description: True when older log bytes were omitted by the fixed response bound.
    DaemonHandoffStatus:
      type: object
      required: [state, verifiedAt, problems, activeEnvironments]
      properties:
        state: { type: string, enum: [ready, blocked] }
        verifiedAt: { type: string, format: date-time }
        problems: { type: array, items: { type: string } }
        activeEnvironments: { type: array, items: { type: string, example: billing/local } }
    DaemonRestart:
      type: object
      required: [restarting, restartId, reason, previousInstanceId, targetBuildId, acceptedAt, deadlineAt, handoff, activeEnvironments]
      properties:
        restarting: { type: boolean, const: true }
        restartId: { type: string, description: Stable identifier shared by every caller whose concurrent trigger coalesced into this replacement. }
        reason: { type: string, enum: [cli, browser, mcp, executable-change] }
        previousInstanceId: { type: string }
        targetBuildId: { type: string, description: SHA-256 identity of the executable the replacement will run. }
        acceptedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time, description: Ready-state deadline five seconds after restart acceptance. }
        handoff: { type: boolean, description: True when every active runtime passed adoption safety checks; false only for an explicitly confirmed browser force restart. }
        activeEnvironments: { type: array, items: { type: string, example: billing/local } }
    DaemonRestartStatus:
      type: object
      required: [restartId, reason, previousInstanceId, instanceId, targetBuildId, acceptedAt, deadlineAt, readyAt, durationMs, withinSla]
      properties:
        restartId: { type: string }
        reason: { type: string, enum: [cli, browser, mcp, executable-change] }
        previousInstanceId: { type: string }
        instanceId: { type: string }
        targetBuildId: { type: string }
        acceptedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        withinSla: { type: boolean }
    DirectorySelection:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Existing absolute directory selected by the user. }
    RelayStatus:
      type: object
      required: [platform, service, installed, running, healthy, httpHealthy, helperPresent, helperVerified, helperCompatible, requiredHelperVersion, configurationPresent, receiptPresent, dnsHealthy, resolverPresent, resolverHealthy, endpointPoolReady, endpointPoolManaged, dnsListenAddress, helperPath, configurationPath, receiptPath]
      properties:
        platform: { type: string, enum: [launchd, systemd, unsupported] }
        service: { type: string }
        installed: { type: boolean }
        running: { type: boolean }
        healthy: { type: boolean }
        httpHealthy: { type: boolean }
        helperPresent: { type: boolean }
        helperVerified: { type: boolean, description: Whether the installed helper's SHA-256 identity matches its root-owned installation receipt. }
        helperCompatible: { type: boolean, description: Whether the installed helper version matches the relay version required by this Portless build. }
        helperBuildId: { type: string, description: Observed SHA-256 identity of the installed relay helper. }
        helperVersion: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', description: Semantic helper version recorded at installation. }
        requiredHelperVersion: { type: string, pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$', description: Semantic relay-helper version required by this Portless build. }
        helperError: { type: string, description: Receipt integrity, compatibility, or helper fingerprint failure. }
        configurationPresent: { type: boolean }
        configurationError: { type: string, description: Service or resolver content and metadata drift from the receipt-bound installation. }
        receiptPresent: { type: boolean }
        dnsHealthy: { type: boolean }
        resolverPresent: { type: boolean }
        resolverHealthy: { type: boolean }
        endpointPoolReady: { type: boolean }
        endpointPoolManaged: { type: boolean, description: Whether this platform provisions an explicit Portless loopback alias pool. }
        endpointPoolResidual: { type: boolean, description: Reserved Portless aliases are configured without a valid ownership receipt. }
        endpointPoolDetail: { type: string }
        endpointPoolError: { type: string, description: Failure inspecting the platform loopback alias pool. }
        ownerUid: { type: integer, minimum: 1 }
        ownerGid: { type: integer, minimum: 1 }
        targetSocket: { type: string }
        dnsTargetSocket: { type: string }
        dnsListenAddress: { type: string, example: '127.77.0.1:1053' }
        helperPath: { type: string }
        configurationPath: { type: string }
        receiptPath: { type: string }
        resolverPath: { type: string, description: Platform configuration that routes the Portless TCP endpoint zone. }
        localhostResolverPath: { type: string, description: Platform compatibility resolver for descendant localhost names when required. }
        installedAt: { type: string, format: date-time }
        healthError: { type: string }
        dnsHealthError: { type: string }
        resolverHealthError: { type: string }
        problem: { type: string }
    SourceInput:
      type: object
      required: [name, path]
      properties:
        name: { $ref: '#/components/schemas/SourceName' }
        path: { type: string, description: Absolute source path. }
        allowedRoot: { type: string, description: Canonical confined discovery root required for MCP source changes. }
    ProjectSource:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/SourceName' }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceName' } }
    SourceBinding:
      allOf:
        - { $ref: '#/components/schemas/SourceInput' }
        - type: object
          required: [status, createdAt, scannedAt]
          properties:
            status: { type: string }
            warnings: { type: array, items: { type: string } }
            createdAt: { type: string, format: date-time }
            scannedAt: { type: string, format: date-time }
    RemoteTarget:
      type: object
      required: [url, classification, writePolicy]
      properties:
        url: { type: string, format: uri, pattern: '^https?://' }
        classification: { type: string, enum: [development, qa, staging, unknown] }
        writePolicy: { type: string, enum: [read-only, read-write], description: Enforced locally before forwarding. WebSocket upgrades require read-write regardless of the GET handshake method. }
        healthPath: { type: string, pattern: '^/' }
    MockTarget:
      type: object
      required: [scenario]
      properties:
        scenario: { $ref: '#/components/schemas/ArtifactName' }
    ComponentBinding:
      type: object
      required: [provider]
      properties:
        service: { $ref: '#/components/schemas/ServiceName' }
        provider: { type: string, enum: [local, container, remote, mock] }
        source: { $ref: '#/components/schemas/SourceName' }
        remote: { $ref: '#/components/schemas/RemoteTarget' }
        mock: { $ref: '#/components/schemas/MockTarget' }
        modifiedAt: { type: string, format: date-time, readOnly: true }
      description: >-
        local requires source, container is valid only for discovered managed
        dependencies, and remote requires remote configuration. Mock bindings are
        managed only through scenario activation, never through individual binding changes.
        A mock binding identifies the environment-scoped scenario owning that service.
    MockQueryMatcher:
      oneOf:
        - type: object
          required: [match]
          additionalProperties: false
          properties:
            match: { type: string, enum: [exists] }
            value: { type: string, maxLength: 0 }
        - type: object
          required: [match, value]
          additionalProperties: false
          properties:
            match: { type: string, enum: [equals] }
            value: { type: string, minLength: 1 }
        - type: object
          required: [match, value]
          additionalProperties: false
          properties:
            match: { type: string, enum: [regex] }
            value: { type: string, minLength: 1, maxLength: 4096 }
      description: >-
        A required, case-sensitive query name matches by presence, exact nonempty
        value, or a Go/RE2 regular expression over an entire decoded value. At least
        one repeated value must match. Regex is case-sensitive unless its pattern
        enables case folding; delimiters are not required. Patterns are limited to
        4096 UTF-8 bytes each and 262144 bytes per scenario, validated at compile time.
    MockRoute:
      type: object
      required: [name, service, method, path, status, enabled]
      properties:
        name: { $ref: '#/components/schemas/ArtifactName' }
        service: { $ref: '#/components/schemas/ServiceName' }
        method: { type: string, pattern: '^[!#$%&''*+.^_`|~0-9A-Za-z-]+$', example: GET }
        path: { type: string, pattern: '^/', example: '/inventory/{sku}' }
        query:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MockQueryMatcher' }
          description: >-
            Required query names and explicit match operators. All names must match.
            At equal path and query-count specificity, more Equals matchers win,
            then more Regex matchers, then Exists. Regex rules with equal specificity
            are conservatively treated as overlapping unless paths or other exact
            query constraints distinguish them.
        status: { $ref: '#/components/schemas/HTTPFinalStatusCode' }
        headers:
          type: object
          additionalProperties: { type: string }
        body: { type: string, maxLength: 1048576 }
        delayMs: { type: integer, format: int64, minimum: 0, maximum: 300000 }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time, readOnly: true }
        modifiedAt: { type: string, format: date-time, readOnly: true }
    MockScenario:
      type: object
      required: [project, environment, name, routes, activation, createdAt, modifiedAt, unmatchedRequests, version]
      properties:
        unmatchedRequests: { $ref: '#/components/schemas/MockUnmatchedRequests' }
        version: { $ref: '#/components/schemas/ResourceVersion' }
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        name: { $ref: '#/components/schemas/ArtifactName' }
        description: { type: string }
        routes: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/MockRoute' } }
        activation: { $ref: '#/components/schemas/MockScenarioActivation' }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
    MockScenarioActivation:
      type: object
      required: [state, targetServices, activeServices]
      properties:
        state: { type: string, enum: [disabled, enabled, degraded], description: Derived from scenario ownership and current service bindings, not service health. }
        targetServices: { type: array, items: { $ref: '#/components/schemas/ServiceName' }, description: Unique sorted service names from all routes, including disabled routes. }
        activeServices: { type: array, items: { $ref: '#/components/schemas/ServiceName' }, description: Services controlled by the selected policy. Running forward policies require compiled runtime state; a stopped environment reports desired configuration. }
        enabledAt: { type: string, format: date-time }
    MockScenarioList:
      type: object
      required: [scenarios]
      properties:
        scenarios: { type: array, items: { $ref: '#/components/schemas/MockScenario' } }
    MockUnmatchedRequests:
      type: string
      enum: [reject, forward]
      description: Reject returns 501 on a miss and replaces the provider. Forward keeps the real HTTP provider and only overrides matches. Change through the scenario policy operation.
    SetMockScenarioPolicyRequest:
      type: object
      required: [unmatchedRequests]
      additionalProperties: false
      properties:
        unmatchedRequests: { $ref: '#/components/schemas/MockUnmatchedRequests' }
    CreateMockRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        unmatchedRequests: { $ref: '#/components/schemas/MockUnmatchedRequests', default: reject }
        name: { $ref: '#/components/schemas/ArtifactName' }
        description: { type: string }
    MockScenarioMutation:
      type: object
      required: [scenario, warnings]
      properties:
        scenario: { $ref: '#/components/schemas/MockScenario' }
        warnings: { type: array, items: { type: string } }
    SetMockScenarioActivationRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ImportMockRecordingRequest:
      type: object
      required: [recording]
      properties:
        recording: { $ref: '#/components/schemas/ArtifactName' }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceName' } }
    ImportMockOpenAPIRequest:
      type: object
      required: [service, document]
      properties:
        service: { $ref: '#/components/schemas/ServiceName' }
        document: { type: string, maxLength: 1048576, description: Complete local OpenAPI 3.0 or 3.1 JSON/YAML document. }
    PreviewMockRequest:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/MockRequest' }
        draft:
          allOf: [{ $ref: '#/components/schemas/MockRoute' }]
          description: Optional route definition overlaid only for this preview. Its service and the complete temporary scenario are validated using the normal matcher rules.
        originalRoute:
          allOf: [{ $ref: '#/components/schemas/ArtifactName' }]
          description: Saved route to replace for preview; requires draft, which may have a new unique name. A missing saved route is an error. Omit to append a new unique draft route.
    MockRequest:
      type: object
      required: [service, method, path]
      properties:
        service: { $ref: '#/components/schemas/ServiceName' }
        method: { type: string }
        path: { type: string, pattern: '^/' }
        query:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        headers:
          type: object
          description: Repeated request header values. Values are validated but are not persisted or used as route matchers.
          additionalProperties: { type: array, items: { type: string } }
        body:
          type: string
          maxLength: 262144
          description: Optional request body used only for the side-effect-free preview. Request bodies are not route matchers.
    MockResponse:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/HTTPFinalStatusCode' }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: string }
        delayMs: { type: integer, format: int64, minimum: 0 }
      description: Fixed response after HEAD/204/304 body suppression. No transport-added headers or delay is performed during preview.
    MockPreview:
      description: Request-specific routing prediction without application I/O, health probes, state changes, or traffic capture. Only mocked/rejected results have a fixed response.
      oneOf:
        - type: object
          additionalProperties: false
          required: [service, outcome, route, response]
          properties:
            service: { $ref: '#/components/schemas/ServiceName' }
            outcome: { const: mocked }
            route: { type: string }
            response: { $ref: '#/components/schemas/MockResponse' }
        - type: object
          additionalProperties: false
          required: [service, outcome, response]
          properties:
            service: { $ref: '#/components/schemas/ServiceName' }
            outcome: { const: rejected }
            response: { $ref: '#/components/schemas/MockResponse' }
        - type: object
          additionalProperties: false
          required: [service, outcome, destination]
          properties:
            service: { $ref: '#/components/schemas/ServiceName' }
            outcome: { const: forward }
            destination:
              type: object
              required: [provider, url]
              properties:
                provider: { type: string, enum: [local, remote] }
                url: { type: string, description: Public Portless endpoint; no private runtime addresses. }
                classification: { type: string }
                writePolicy: { type: string, enum: [read-only, read-write] }
        - type: object
          additionalProperties: false
          required: [service, outcome, reason]
          properties:
            service: { $ref: '#/components/schemas/ServiceName' }
            outcome: { const: blocked }
            reason:
              type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
    HealthCheck:
      type: object
      required: [kind, timeout, interval]
      properties:
        kind: { type: string, enum: [tcp, http, exec] }
        path: { type: string }
        timeout: { type: integer, description: Nanoseconds as encoded by Go time.Duration. }
        interval: { type: integer, description: Nanoseconds as encoded by Go time.Duration. }
    ServiceDefinition:
      type: object
      required: [name, kind, required, health]
      properties:
        name: { $ref: '#/components/schemas/ServiceName' }
        kind: { type: string, enum: [process, resource] }
        framework: { type: string }
        resource:
          type: object
          required: [type, version]
          properties:
            type: { type: string, example: postgres }
            version: { type: string, example: '17' }
        command: { type: array, items: { type: string } }
        workingDirectory: { type: string }
        serviceDirectory: { type: string }
        debug:
          type: object
          required: [adapter, launcher, command]
          properties:
            adapter: { type: string, enum: [node-inspector, jdwp] }
            launcher: { type: string, enum: [node-direct, nest-cli, spring-gradle, spring-maven] }
            command: { type: array, items: { type: string } }
        portEnvironment: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535, description: Plugin-resolved client-facing port for a TCP service. }
        environment: { type: object, additionalProperties: { type: string } }
        required: { type: boolean }
        health: { $ref: '#/components/schemas/HealthCheck' }
    Service:
      allOf:
        - { $ref: '#/components/schemas/ServiceDefinition' }
        - type: object
          required: [status, launchMode, generation, endpoints, restartCount, recentRequests]
          properties:
            mock:
              type: object
              required: [scenario, unmatchedRequests, state]
              properties:
                scenario: { $ref: '#/components/schemas/ArtifactName' }
                unmatchedRequests: { $ref: '#/components/schemas/MockUnmatchedRequests' }
                state: { type: string, enum: [disabled, enabled, degraded] }
            status: { type: string, enum: [planned, starting, recovering, ready, unhealthy, exited, failed, stopping, stopped, unknown] }
            launchMode: { type: string, enum: [managed, debug] }
            debugger:
              type: object
              required: [adapter, host, port, state]
              properties:
                adapter: { type: string, enum: [node-inspector, jdwp] }
                host: { type: string, const: '127.0.0.1' }
                port: { type: integer, minimum: 1, maximum: 65535 }
                state: { type: string, enum: [starting, listening, stopped] }
            reason: { type: string }
            generation: { type: integer, format: int64 }
            pid: { type: integer }
            upstreamPort: { type: integer }
            endpoints: { type: array, items: { $ref: '#/components/schemas/Endpoint' } }
            startedAt: { type: string, format: date-time }
            restartCount: { type: integer, format: int64 }
            recentRequests: { type: integer, format: int64 }
            p95Millis: { type: integer, format: int64 }
    Connection:
      type: object
      required: [source, target, protocol, required]
      properties:
        source: { type: string, description: Service name or external. }
        target: { $ref: '#/components/schemas/ServiceName' }
        protocol: { type: string, enum: [http, tcp] }
        applicationProtocol: { type: string, enum: [postgresql, redis, mysql, nats], description: Declared protocol used for bounded TCP operation inspection. }
        binding: { type: string, description: Resource plugin responsible for connection formatting. }
        environment: { type: string }
        required: { type: boolean }
    Endpoint:
      type: object
      required: [kind, protocol, host, port, url]
      properties:
        kind: { type: string, enum: [public, connection] }
        protocol: { type: string, enum: [http, tcp] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        url: { type: string, format: uri, example: 'tcp://postgres.local.store.portless.test:5432' }
        address: { type: string, description: Internal listener address when needed for diagnostics. }
    EffectiveConnection:
      allOf:
        - { $ref: '#/components/schemas/Connection' }
        - type: object
          required: [targetProvider, targetStatus]
          properties:
            targetProvider: { type: string, enum: [local, container, remote, mock] }
            targetStatus: { type: string, enum: [planned, starting, recovering, ready, unhealthy, exited, failed, stopping, stopped, unknown] }
            endpoint: { $ref: '#/components/schemas/Endpoint' }
            runtimeTarget: { type: string, description: Raw process, container, or remote target retained only for diagnostics. }
            injectedEnvironment:
              type: object
              additionalProperties: { type: string }
              description: Redacted environment values generated for the source service.
    ConfigurationValue:
      type: object
      required: [key, value, classification, source]
      properties:
        key: { type: string }
        value: { type: string }
        classification: { type: string, enum: [public, masked, generated] }
        source: { type: string }
    ServiceConfiguration:
      type: object
      required: [service, command, environment, health]
      properties:
        service: { $ref: '#/components/schemas/ServiceName' }
        command: { type: array, items: { type: string } }
        workingDirectory: { type: string }
        portEnvironment: { type: string }
        environment: { type: array, items: { $ref: '#/components/schemas/ConfigurationValue' } }
        health: { $ref: '#/components/schemas/HealthCheck' }
    LogEntry:
      type: object
      required: [timestamp, service, stream, generation, message]
      properties:
        timestamp: { type: string, format: date-time }
        service: { $ref: '#/components/schemas/ServiceName' }
        stream: { type: string, enum: [stdout, stderr, container] }
        generation: { type: integer, format: int64, minimum: 1 }
        message: { type: string }
    LogEntries:
      type: object
      required: [project, environment, service, entries]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        service: { type: string, description: Empty when entries from all services were requested. }
        entries: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
    TrafficMessageField:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
    TrafficMessage:
      type: object
      required: [type, offsetMs, wireBytes]
      properties:
        type: { type: string }
        offsetMs: { type: integer, format: int64, minimum: 0 }
        summary: { type: string }
        wireBytes: { type: integer, format: int64, minimum: 0 }
        contentBytes: { type: integer, format: int64, minimum: 0 }
        capturedBytes: { type: integer, format: int64, minimum: 0 }
        truncated: { type: boolean }
        content: { type: string, description: Bounded decoded application content represented as UTF-8 or base64. }
        contentType: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
        fields: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/TrafficMessageField' } }
    TrafficTCPExchange:
      type: object
      required: [kind, inspection]
      properties:
        kind: { type: string, enum: [operation, session] }
        applicationProtocol: { type: string, enum: [postgresql, redis, mysql, nats] }
        operation: { type: string }
        inspection: { type: string, enum: [decoded, opaque, encrypted, unsupported, malformed, limited] }
        inspectionReason: { type: string }
        outcome: { type: string, enum: [success, error, one-way, incomplete] }
        requestMessageCount: { type: integer, minimum: 0 }
        responseMessageCount: { type: integer, minimum: 0 }
        requestMessages: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/TrafficMessage' } }
        responseMessages: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/TrafficMessage' } }
        requestTruncated: { type: boolean }
        responseTruncated: { type: boolean }
      description: Present for TCP exchanges. Decoded operations are emitted while pooled connections remain open; opaque sessions retain only inspection state and wire-byte totals.
    TrafficExchange:
      type: object
      required: [project, environment, sequence, protocol, source, target, background, startedAt, completedAt, durationMs, requestBytes, responseBytes]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        sequence: { type: integer, format: int64, minimum: 1 }
        protocol: { type: string, enum: [http, tcp] }
        source: { type: string }
        target: { type: string }
        background: { type: boolean, description: Successful browser or client/connection-pool housekeeping. The raw exchange is retained, while a standalone trace is hidden by default. Errors and faulted operations are never background. }
        targetProvider: { type: string, enum: [local, container, remote, mock] }
        remoteClassification: { type: string, enum: [development, qa, staging, unknown] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        method: { type: string }
        host: { type: string }
        path: { type: string }
        requestTarget: { type: string, description: Exact escaped path and query string received by the proxy. }
        requestKind: { type: string, enum: [navigation, subresource, fetch, service, unknown] }
        status: { type: integer, description: HTTP response status. A WebSocket handshake completes with 101 after its downstream headers flush. }
        durationMs: { type: integer, format: int64, description: Exchange duration. For a WebSocket this measures only its opening handshake. }
        requestBytes: { type: integer, format: int64, description: HTTP body or TCP wire bytes. Zero for a WebSocket handshake; frames are not counted. }
        responseBytes: { type: integer, format: int64, description: HTTP body or TCP wire bytes. Zero for a WebSocket handshake; frames are not counted. }
        requestCapturedBytes: { type: integer, format: int64, minimum: 0 }
        responseCapturedBytes: { type: integer, format: int64, minimum: 0 }
        fault: { type: string }
        recording: { type: string }
        mockOutcome: { type: string, enum: [mocked, forwarded, rejected, blocked], description: Scenario decision; absent when no scenario was evaluated. }
        mockScenario: { type: string, description: Mock scenario evaluated for this exchange. }
        mockRoute: { type: string, description: Mock route that matched this exchange. }
        error: { type: string }
        traceId: { type: string, pattern: '^[0-9a-f]{32}$', description: Normalized trace identifier extracted from W3C/OpenTelemetry, B3, or Datadog context, or generated by Portless. }
        spanId: { type: string, pattern: '^[0-9a-f]{16}$', description: Portless proxy span identifier in normalized lower-hex form. }
        parentSpanId: { type: string, pattern: '^[0-9a-f]{16}$', description: Incoming parent span identifier normalized from the selected propagation format. }
        traceContextSource: { type: string, enum: [generated, portless, w3c, b3, datadog], description: Whether Portless generated this context, recognized it as a context Portless previously injected, or selected and continued an incoming application propagation format. }
        requestHeaders:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Application-supplied headers received by Portless before forwarding changes. Propagation carriers previously injected by Portless are omitted. Repeated values are preserved; known credential-bearing values including Sec-WebSocket-Protocol are replaced with [REDACTED] before retention.
        responseHeaders:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Repeated values are preserved; known credential-bearing values including Sec-WebSocket-Protocol are replaced with [REDACTED] before retention.
        requestBody: { type: string, description: Bounded inspectable request-body prefix. WebSocket messages are never included. }
        responseBody: { type: string, description: Bounded inspectable response-body prefix. WebSocket messages are never included. }
        requestBodyTruncated: { type: boolean }
        responseBodyTruncated: { type: boolean }
        requestCapture: { $ref: '#/components/schemas/HTTPCapture' }
        responseCapture: { $ref: '#/components/schemas/HTTPCapture' }
        replay: { $ref: '#/components/schemas/TrafficReplay' }
        tcp: { $ref: '#/components/schemas/TrafficTCPExchange' }
    HTTPCapture:
      type: object
      required: [state, observedBytes, capturedBytes, encoding, exact]
      properties:
        state: { type: string, enum: [empty, complete, truncated, omitted, unsupported, incomplete] }
        observedBytes: { type: integer, format: int64, minimum: 0 }
        capturedBytes: { type: integer, format: int64, minimum: 0 }
        encoding: { type: string, description: HTTP Content-Encoding; identity when absent. }
        exact: { type: boolean, description: Complete retained UTF-8 bytes are identical to observed body bytes; redaction still makes values unknown. }
    TrafficReplay:
      type: object
      required: [project, environment, sequence, startedAt, workspace, run]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        sequence: { type: integer, format: int64, minimum: 1 }
        startedAt: { type: string, format: date-time }
        workspace: { type: integer, format: int64, minimum: 1 }
        run: { type: integer, format: int64, minimum: 1 }
      description: Original exchange identity and public replay numbers. Replay is a fresh foreground trace root.
    TrafficReplayIdentity:
      type: object
      required: [createdAt, daemonStartedAt]
      properties:
        createdAt: { type: string, format: date-time }
        daemonStartedAt: { type: string, format: date-time }
      description: Both timestamps from the workspace response are required on every mutation. Numbers alone are not durable identities.
    PrepareTrafficReplayRequest:
      type: object
      additionalProperties: false
      required: [sequence, startedAt]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        startedAt: { type: string, format: date-time }
    TrafficReplayDraft:
      type: object
      additionalProperties: false
      required: [environment, method, requestTarget, headers, bodyMode, body]
      properties:
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        method: { type: string, enum: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE] }
        requestTarget: { type: string, description: Escaped origin-form path and raw query, at most 8192 bytes. Absolute URLs, fragments, invalid escapes and authority-form targets are rejected. }
        headers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Case-insensitive names with ordered repeated values; at most 128 rows and 32 KiB. Routing, framing, browser security, Portless and old trace carriers are prohibited. Accept-Encoding is identity. Redacted credentials require replacement or explicit omission.
        bodyMode: { type: string, enum: [captured, replacement, empty] }
        body: { type: string, description: Complete UTF-8 text, at most 25 MiB of decoded bytes. Captured requires complete exact original bytes; replacement supplies complete new text; empty requires an empty string. Oversized bodies return a structured 413 replay_input_limit error before dispatch. }
        omittedHeaders: { type: array, maxItems: 128, items: { type: string }, description: Explicitly omitted captured headers, including unresolved credentials. Cannot also be supplied in headers. }
    UpdateTrafficReplayDraftRequest:
      allOf:
        - { $ref: '#/components/schemas/TrafficReplayIdentity' }
        - type: object
          required: [revision, draft]
          properties:
            revision: { type: integer, format: int64, minimum: 1 }
            draft: { $ref: '#/components/schemas/TrafficReplayDraft' }
      unevaluatedProperties: false
    RunTrafficReplayRequest:
      allOf:
        - { $ref: '#/components/schemas/TrafficReplayIdentity' }
        - type: object
          required: [revision, runNumber, confirmRemoteWrite]
          properties:
            revision: { type: integer, format: int64, minimum: 1 }
            runNumber: { type: integer, format: int64, minimum: 1, maximum: 32 }
            confirmRemoteWrite: { type: boolean, description: Required true for reviewed mutating requests to a read-write remote target. Cannot override read-only policy. }
      unevaluatedProperties: false
    TrafficReplayDestination:
      type: object
      required: [environment, provider, url, requiresConfirmation]
      properties:
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        provider: { type: string, enum: [local, container, remote, mock] }
        mockScenario: { type: string, description: Scenario evaluated for this prepared request. }
        mockRoute: { type: string, description: Matched route when a partial mock serves this prepared request. }
        classification: { type: string, enum: [development, qa, staging, unknown] }
        writePolicy: { type: string, enum: [read-only, read-write] }
        url: { type: string, format: uri, description: Stable public service URL; never a private upstream address. }
        requiresConfirmation: { type: boolean }
    TrafficReplayLimitation:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    TrafficReplayRun:
      type: object
      required: [number, revision, state, outcome, startedAt, deadline]
      properties:
        number: { type: integer, format: int64, minimum: 1, maximum: 32 }
        revision: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [running, completed, failed, interrupted] }
        outcome: { type: string, enum: [not-sent, response-received, unknown], description: A running receipt is not final delivery evidence. Unknown means the application may have received a request; it is never automatically retried. }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        error: { type: string, description: Safe classified failure with no raw application or transport error. }
    TrafficReplayChange:
      type: object
      required: [path, kind]
      properties:
        path: { type: string, description: JSON Pointer for structural JSON differences; header name or line location for other formats. }
        kind: { type: string, enum: [added, removed, changed, type-changed] }
        before: { type: string, description: Retained scalar spelling; numeric tokens are never converted to floating point. }
        after: { type: string }
    TrafficComparisonSection:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [equal, different, partial, unavailable] }
        format: { type: string, enum: [json, text, headers] }
        reason: { type: string }
        changes: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/TrafficReplayChange' } }
    TrafficResponseComparison:
      type: object
      required: [state, originalStatus, replayStatus, statusChanged, durationDeltaMs, headers, body]
      properties:
        state: { type: string, enum: [equal, different, partial, unavailable] }
        originalStatus: { type: integer }
        replayStatus: { type: integer }
        statusChanged: { type: boolean }
        durationDeltaMs: { type: integer, format: int64 }
        headers: { $ref: '#/components/schemas/TrafficComparisonSection' }
        body: { $ref: '#/components/schemas/TrafficComparisonSection' }
      description: Compares bounded redacted observations. JSON ignores object-key order while preserving numeric spelling and array order. Duplicate keys, invalid JSON and structural limits use bounded text comparison with a reason. Unknown content cannot establish equality.
    TrafficReplayResult:
      type: object
      required: [runNumber, request, destination, comparison]
      properties:
        runNumber: { type: integer, format: int64, minimum: 1 }
        request: { $ref: '#/components/schemas/TrafficReplayDraft' }
        destination: { $ref: '#/components/schemas/TrafficReplayDestination' }
        exchange: { $ref: '#/components/schemas/TrafficExchange' }
        comparison: { $ref: '#/components/schemas/TrafficResponseComparison' }
        limitations: { type: array, items: { $ref: '#/components/schemas/TrafficReplayLimitation' } }
    TrafficReplayWorkspace:
      allOf:
        - { $ref: '#/components/schemas/TrafficReplayIdentity' }
        - type: object
          required: [project, environment, number, revision, nextRunNumber]
          properties:
            project: { $ref: '#/components/schemas/ProjectName' }
            environment: { $ref: '#/components/schemas/EnvironmentName' }
            number: { type: integer, format: int64, minimum: 1 }
            preparedUntil: { type: string, format: date-time }
            revision: { type: integer, format: int64, minimum: 1 }
            nextRunNumber: { type: integer, format: int64, minimum: 1 }
            baseline: { $ref: '#/components/schemas/TrafficExchange' }
            draft: { $ref: '#/components/schemas/TrafficReplayDraft' }
            destination: { $ref: '#/components/schemas/TrafficReplayDestination' }
            limitations: { type: array, items: { $ref: '#/components/schemas/TrafficReplayLimitation' } }
            run: { $ref: '#/components/schemas/TrafficReplayRun' }
            receipts: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/TrafficReplayRun' } }
            result: { $ref: '#/components/schemas/TrafficReplayResult' }
      description: Ephemeral workspace in the original project/environment. At most 32 active sessions per daemon, 8 per origin, 1 GiB aggregate state, 4 concurrent runs and 1 per workspace. Sessions have no fixed lifetime. Explicit activity, successful draft preparation and run admission renew a one-hour idle timeout. Closing releases payloads immediately; compact admitted receipts remain until idle cleanup and count only toward the aggregate memory budget. Prepared secret values expire within 60 seconds and are never returned. Baseline is frozen; result is the latest completed observation.
    TrafficClearResponse:
      type: object
      required: [cleared, throughSequence, revision]
      properties:
        cleared: { type: integer, minimum: 0, description: Number of live exchanges removed. }
        revision: { type: integer, format: int64, minimum: 1, description: Environment projection revision after Clear. Older trace updates cannot restore cleared rows. }
        throughSequence: { type: integer, format: int64, minimum: 0, description: Highest environment-local sequence covered by the clear. }
    TrafficTraceSpan:
      type: object
      required: [exchange, depth, startOffsetMs, correlation]
      properties:
        exchange: { $ref: '#/components/schemas/TrafficExchange' }
        parentSequence: { type: integer, format: int64, minimum: 1 }
        depth: { type: integer, minimum: 0 }
        startOffsetMs: { type: integer, format: int64, minimum: 0 }
        correlation: { type: string, enum: [exact, inferred, partial, ambiguous] }
        transactionGroup: { type: integer, minimum: 1, description: Trace-local group shared by decoded operations from one explicit database transaction on one TCP connection. }
    TrafficTrace:
      type: object
      required: [project, environment, revision, number, lastSequence, protocol, startedAt, completedAt, durationMs, source, target, error, faulted, background, provisional, spanCount, correlation]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        revision: { type: integer, format: int64, minimum: 1, description: Most recent change to this trace projection. Unchanged traces retain their revision; resets with the daemon. }
        number: { type: integer, format: int64, minimum: 1, description: Environment-local number equal to the earliest retained exchange sequence in the trace. }
        lastSequence: { type: integer, format: int64, minimum: 1, description: Highest exchange sequence currently included in this trace. The trace revision governs update ordering; list responses carry the complete projection watermark. }
        traceId: { type: string, pattern: '^[0-9a-f]{32}$', description: Normalized trace identifier for the projected root exchange. }
        rootSequence: { type: integer, format: int64, minimum: 1 }
        protocol: { type: string, enum: [http, tcp], description: Protocol of the current root exchange. }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64, minimum: 0 }
        method: { type: string }
        requestTarget: { type: string }
        source: { type: string }
        target: { type: string }
        status: { type: integer }
        error: { type: boolean }
        faulted: { type: boolean }
        background: { type: boolean }
        provisional: { type: boolean, description: True while an active HTTP request can still absorb this TCP-rooted projection. }
        spanCount: { type: integer, minimum: 1 }
        correlation: { type: string, enum: [exact, inferred, partial, ambiguous] }
        spans: { type: array, items: { $ref: '#/components/schemas/TrafficTraceSpan' } }
    EnvironmentSummary:
      type: object
      required: [project, name, revision, status, serviceCount, readyCount, remoteCount, updatedAt]
