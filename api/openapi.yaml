openapi: 3.1.0
info:
  title: Portless local control API
  version: 0.2.0
  description: >-
    Loopback-only API shared by the Portless CLI and embedded UI. Projects are
    reusable application topologies. Environments are independently configured
    and runnable instances. Public routes use readable project, environment,
    service, and artifact names; private ownership keys are never exposed.
servers:
  - url: http://portless.localhost/api/v1
security:
  - bearer: []
  - browserSession: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Daemon readiness
          content:
            application/json:
              schema:
                type: object
                required: [ready, apiVersion]
                properties:
                  ready: { type: boolean }
                  apiVersion: { type: string }
  /system:
    get:
      operationId: system
      responses:
        '200': { description: Local daemon metadata }
  /runtime:
    get:
      operationId: runtimeStatus
      responses:
        '200':
          description: Docker/Podman selection and availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
    put:
      operationId: selectRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preference]
              properties:
                preference: { type: string, enum: [auto, docker, podman] }
      responses:
        '200':
          description: Persisted runtime preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runtime/start:
    post:
      operationId: startRuntime
      responses:
        '200': { description: Selected container runtime is ready }
        '503': { $ref: '#/components/responses/Unavailable' }
  /browser-claims:
    post:
      operationId: createBrowserClaim
      description: CLI bearer authentication only; claims are single-use and short-lived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [next]
              properties:
                next: { type: string, example: /environments/billing/local }
      responses:
        '201': { description: Browser claim URL and expiry }
  /session:
    get:
      operationId: session
      responses:
        '200': { description: Current CLI or browser principal and CSRF token }
  /session/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Browser session removed }
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Logical projects with environment summaries
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      operationId: createProject
      description: Discover and combine one or more named source checkouts, then create the local environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sources]
              properties:
                name: { $ref: '#/components/schemas/ProjectName' }
                sources:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201': { description: Project, initial environment, and discovery warnings }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/discover:
    post:
      operationId: discoverProject
      description: CLI-only single-checkout discovery used by bare `portless up`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Absolute checkout path from the CLI process. }
                name: { $ref: '#/components/schemas/ProjectName' }
      responses:
        '200': { description: Existing or newly created project and local environment }
  /projects/{projectName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
    get:
      operationId: getProject
      responses:
        '200':
          description: Logical topology and environment summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: renameProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, revision]
              properties:
                name: { $ref: '#/components/schemas/ProjectName' }
                revision: { type: integer, format: int64 }
      responses:
        '200': { description: Renamed project; all environments must be stopped }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: forgetProject
      responses:
        '204': { description: Stopped project and all environment metadata forgotten }
  /projects/{projectName}/declaration:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
    get:
      operationId: exportProjectDeclaration
      responses:
        '200': { description: Generated portless.project.json }
  /environments:
    get:
      operationId: listEnvironments
      parameters:
        - in: query
          name: project
          schema: { $ref: '#/components/schemas/ProjectName' }
      responses:
        '200':
          description: Environments across all projects or one filtered project
          content:
            application/json:
              schema:
                type: object
                required: [environments]
                properties:
                  environments:
                    type: array
                    items: { $ref: '#/components/schemas/Environment' }
    post:
      operationId: cloneEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name]
              properties:
                project: { $ref: '#/components/schemas/ProjectName' }
                name: { $ref: '#/components/schemas/EnvironmentName' }
                from: { $ref: '#/components/schemas/EnvironmentName', default: local }
      responses:
        '201':
          description: New stopped environment with copied source and provider configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
  /environments/resolve:
    get:
      operationId: resolveEnvironmentForPath
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, description: Absolute checkout path. }
      responses:
        '200': { description: Selected environment, or all environments containing the checkout }
  /environments/select:
    put:
      operationId: selectEnvironmentForPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, project, environment]
              properties:
                path: { type: string, description: Absolute checkout path. }
                project: { $ref: '#/components/schemas/ProjectName' }
                environment: { $ref: '#/components/schemas/EnvironmentName' }
      responses:
        '204': { description: Checkout context selection persisted }
  /environments/{projectName}/{environmentName}:
    parameters: &environmentParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
    get:
      operationId: getEnvironment
      responses:
        '200':
          description: Effective sources, providers, topology, and runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: forgetEnvironment
      responses:
        '204': { description: Stopped environment metadata forgotten }
  /environments/{projectName}/{environmentName}/rescan:
    parameters: *environmentParameters
    post:
      operationId: rescanEnvironment
      responses:
        '200': { description: Refreshed all source discovery and recompiled topology }
  /environments/{projectName}/{environmentName}/up:
    parameters: *environmentParameters
    post:
      operationId: up
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      responses:
        '202':
          description: Durable startup operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /environments/{projectName}/{environmentName}/down:
    parameters: *environmentParameters
    post:
      operationId: down
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                removeVolumes: { type: boolean, default: false }
      responses:
        '202':
          description: Durable shutdown operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /environments/{projectName}/{environmentName}/bindings/{serviceName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/ServiceName' }
    put:
      operationId: setComponentProvider
      description: Environment must be stopped. The service field, if present, is replaced by the path service name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentBinding' }
      responses:
        '200':
          description: Recompiled environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Environment' }
  /environments/{projectName}/{environmentName}/sources/{sourceName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/SourceName' }
    put:
      operationId: setEnvironmentSourcePath
      description: Re-discovers a checkout or Git worktree and recompiles the stopped environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Absolute checkout or worktree path. }
      responses:
        '200': { description: Recompiled environment and discovery warnings }
  /environments/{projectName}/{environmentName}/services:
    parameters: *environmentParameters
    get:
      operationId: listServices
      responses:
        '200': { description: Effective service runtime snapshots }
  /environments/{projectName}/{environmentName}/services/{serviceName}:
    parameters: &serviceParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/ServiceName' }
    get:
      operationId: getService
      responses:
        '200': { description: Service runtime snapshot }
  /environments/{projectName}/{environmentName}/services/{serviceName}/start:
    parameters: *serviceParameters
    post:
      operationId: startService
      responses:
        '202': { description: Service operation accepted }
  /environments/{projectName}/{environmentName}/services/{serviceName}/stop:
    parameters: *serviceParameters
    post:
      operationId: stopService
      responses:
        '202': { description: Service operation accepted }
  /environments/{projectName}/{environmentName}/services/{serviceName}/restart:
    parameters: *serviceParameters
    post:
      operationId: restartService
      responses:
        '202': { description: Service operation accepted }
  /environments/{projectName}/{environmentName}/services/{serviceName}/configuration:
    parameters: *serviceParameters
    get:
      operationId: serviceConfiguration
      responses:
        '200': { description: Masked static configuration }
  /environments/{projectName}/{environmentName}/connections:
    parameters: *environmentParameters
    get:
      operationId: listConnections
      responses:
        '200': { description: Effective source/target edges }
  /environments/{projectName}/{environmentName}/logs:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: query
        name: service
        required: true
        schema: { $ref: '#/components/schemas/ServiceName' }
    get:
      operationId: serviceLogs
      responses:
        '200': { description: Bounded merged stdout/stderr lines }
  /environments/{projectName}/{environmentName}/traffic/{protocol}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - in: path
        name: protocol
        required: true
        schema: { type: string, enum: [http, tcp] }
    get:
      operationId: traffic
      responses:
        '200': { description: Newest-first bounded traffic summaries }
  /environments/{projectName}/{environmentName}/stream:
    parameters: *environmentParameters
    get:
      operationId: environmentStream
      parameters:
        - in: query
          name: topic
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200': { description: text/event-stream; see api/events.md }
  /environments/{projectName}/{environmentName}/recordings:
    parameters: *environmentParameters
    get:
      operationId: listRecordings
      responses:
        '200': { description: Environment recordings }
    post:
      operationId: startRecording
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingInput' }
      responses:
        '201': { description: Active bounded recording }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}:
    parameters: &recordingParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/RecordingName' }
    get:
      operationId: getRecording
      responses:
        '200': { description: Recording metadata }
    delete:
      operationId: deleteRecording
      responses:
        '204': { description: Completed recording deleted }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}/stop:
    parameters: *recordingParameters
    post:
      operationId: stopRecording
      responses:
        '200': { description: Completed recording }
  /environments/{projectName}/{environmentName}/recordings/{recordingName}/export:
    parameters: *recordingParameters
    get:
      operationId: exportRecording
      responses:
        '200': { description: Portless JSON recording export }
  /environments/{projectName}/{environmentName}/faults:
    parameters: *environmentParameters
    get:
      operationId: listFaults
      responses:
        '200': { description: Environment fault rules }
    post:
      operationId: createFault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaultInput' }
      responses:
        '201': { description: Enabled fault rule }
  /environments/{projectName}/{environmentName}/faults/{faultName}:
    parameters:
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/FaultName' }
    get:
      operationId: getFault
      responses:
        '200': { description: Fault rule }
    delete:
      operationId: disableFault
      responses:
        '204': { description: Rule disabled; audit history retained }
  /environments/{projectName}/{environmentName}/faults/disable-all:
    parameters: *environmentParameters
    post:
      operationId: disableAllFaults
      responses:
        '200': { description: Active rules disabled atomically }
  /environments/{projectName}/{environmentName}/operations:
    parameters: *environmentParameters
    get:
      operationId: listOperations
      responses:
        '200': { description: Newest-first environment operations }
  /environments/{projectName}/{environmentName}/operations/{operationNumber}:
    parameters: &operationParameters
      - { $ref: '#/components/parameters/ProjectName' }
      - { $ref: '#/components/parameters/EnvironmentName' }
      - { $ref: '#/components/parameters/OperationNumber' }
    get:
      operationId: getOperation
      responses:
        '200':
          description: Operation with events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
  /environments/{projectName}/{environmentName}/operations/{operationNumber}/events:
    parameters: *operationParameters
    get:
      operationId: operationEvents
      responses:
        '200': { description: Ordered operation events }
  /environments/{projectName}/{environmentName}/timeline:
    parameters: *environmentParameters
    get:
      operationId: timeline
      responses:
        '200': { description: Newest-first durable environment timeline }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Mode-0600 installation secret used by the local CLI.
    browserSession:
      type: apiKey
      in: cookie
      name: portless_session
      description: SameSite=Strict browser session; mutations also require X-Portless-CSRF.
  parameters:
    ProjectName:
      in: path
      name: projectName
      required: true
      schema: { $ref: '#/components/schemas/ProjectName' }
    EnvironmentName:
      in: path
      name: environmentName
      required: true
      schema: { $ref: '#/components/schemas/EnvironmentName' }
    ServiceName:
      in: path
      name: serviceName
      required: true
      schema: { $ref: '#/components/schemas/ServiceName' }
    SourceName:
      in: path
      name: sourceName
      required: true
      schema: { $ref: '#/components/schemas/SourceName' }
    RecordingName:
      in: path
      name: recordingName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    FaultName:
      in: path
      name: faultName
      required: true
      schema: { $ref: '#/components/schemas/ArtifactName' }
    OperationNumber:
      in: path
      name: operationNumber
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    NotFound:
      description: Named resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Name, revision, provider, or current-state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Required local runtime unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ProjectName: &dnsName
      type: string
      pattern: '^[a-z][a-z0-9-]{0,62}$'
      examples: [billing]
    EnvironmentName: *dnsName
    ServiceName: *dnsName
    SourceName: *dnsName
    ArtifactName:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
      examples: [checkout-debug]
    RuntimeStatus:
      type: object
      required: [preference, state, candidates]
      properties:
        preference: { type: string, enum: [auto, docker, podman] }
        selected: { type: string, enum: [docker, podman] }
        state: { type: string, enum: [ready, missing, failed] }
        version: { type: string }
        reason: { type: string }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
    SourceInput:
      type: object
      required: [name, path]
      properties:
        name: { $ref: '#/components/schemas/SourceName' }
        path: { type: string, description: Absolute path resolved by the CLI. }
    ProjectSource:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/SourceName' }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceName' } }
    SourceBinding:
      allOf:
        - { $ref: '#/components/schemas/SourceInput' }
        - type: object
          required: [status, scannedAt]
          properties:
            status: { type: string }
            warnings: { type: array, items: { type: string } }
            scannedAt: { type: string, format: date-time }
    RemoteTarget:
      type: object
      required: [url, classification, writePolicy]
      properties:
        url: { type: string, format: uri, pattern: '^https?://' }
        classification: { type: string, enum: [development, qa, staging, unknown] }
        writePolicy: { type: string, enum: [read-only, read-write] }
        healthPath: { type: string, pattern: '^/' }
    ComponentBinding:
      type: object
      required: [provider]
      properties:
        service: { $ref: '#/components/schemas/ServiceName' }
        provider: { type: string, enum: [local, container, remote] }
        source: { $ref: '#/components/schemas/SourceName' }
        remote: { $ref: '#/components/schemas/RemoteTarget' }
      description: >-
        local requires source, container is valid only for discovered managed
        dependencies, and remote requires remote configuration.
    HealthCheck:
      type: object
      required: [kind, timeout, interval]
      properties:
        kind: { type: string, enum: [tcp, http, exec] }
        path: { type: string }
        timeout: { type: integer, description: Nanoseconds as encoded by Go time.Duration. }
        interval: { type: integer, description: Nanoseconds as encoded by Go time.Duration. }
    ServiceDefinition:
      type: object
      required: [name, kind, required, health]
      properties:
        name: { $ref: '#/components/schemas/ServiceName' }
        kind: { type: string, enum: [process, container] }
        framework: { type: string }
        template: { type: string, enum: [postgres, valkey] }
        version: { type: string }
        command: { type: array, items: { type: string } }
        workingDirectory: { type: string }
        portEnvironment: { type: string }
        environment: { type: object, additionalProperties: { type: string } }
        required: { type: boolean }
        health: { $ref: '#/components/schemas/HealthCheck' }
    Service:
      allOf:
        - { $ref: '#/components/schemas/ServiceDefinition' }
        - type: object
          required: [status, generation, restartCount, recentRequests]
          properties:
            status: { type: string, enum: [planned, starting, ready, unhealthy, exited, failed, stopping, stopped, unknown] }
            reason: { type: string }
            generation: { type: integer, format: int64 }
            pid: { type: integer }
            upstreamPort: { type: integer }
            ingressUrl: { type: string, format: uri }
            startedAt: { type: string, format: date-time }
            restartCount: { type: integer, format: int64 }
            recentRequests: { type: integer, format: int64 }
            p95Millis: { type: integer, format: int64 }
    Connection:
      type: object
      required: [source, target, protocol, required]
      properties:
        source: { type: string, description: Service name or external. }
        target: { $ref: '#/components/schemas/ServiceName' }
        protocol: { type: string, enum: [http, tcp, postgres, redis] }
        environment: { type: string }
        required: { type: boolean }
    EnvironmentSummary:
      type: object
      required: [project, name, revision, status, serviceCount, readyCount, remoteCount, updatedAt]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        name: { $ref: '#/components/schemas/EnvironmentName' }
        revision: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/EnvironmentStatus' }
        reason: { type: string }
        serviceCount: { type: integer }
        readyCount: { type: integer }
        remoteCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        dashboardUrl: { type: string, format: uri }
    Project:
      type: object
      required: [name, revision, createdAt, updatedAt]
      properties:
        name: { $ref: '#/components/schemas/ProjectName' }
        revision: { type: integer, format: int64 }
        primaryService: { $ref: '#/components/schemas/ServiceName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dashboardUrl: { type: string, format: uri }
        sources: { type: array, items: { $ref: '#/components/schemas/ProjectSource' } }
        services: { type: array, items: { $ref: '#/components/schemas/ServiceDefinition' } }
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        environments: { type: array, items: { $ref: '#/components/schemas/EnvironmentSummary' } }
    EnvironmentStatus:
      type: string
      enum: [starting, healthy, degraded, failed, stopping, stopped, unknown]
    ConfigurationIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        subject: { type: string }
        message: { type: string }
        remediation: { type: string }
    Environment:
      type: object
      required: [project, name, revision, status, createdAt, updatedAt, services, connections]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        name: { $ref: '#/components/schemas/EnvironmentName' }
        revision: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/EnvironmentStatus' }
        reason: { type: string }
        primaryService: { $ref: '#/components/schemas/ServiceName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dashboardUrl: { type: string, format: uri }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceBinding' } }
        bindings: { type: array, items: { $ref: '#/components/schemas/ComponentBinding' } }
        services: { type: array, items: { $ref: '#/components/schemas/Service' } }
        connections: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        issues: { type: array, items: { $ref: '#/components/schemas/ConfigurationIssue' } }
    Operation:
      type: object
      required: [project, environment, number, type, state, actor, startedAt]
      properties:
        project: { $ref: '#/components/schemas/ProjectName' }
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        number: { type: integer, format: int64 }
        type: { type: string }
        state: { type: string, enum: [running, succeeded, failed] }
        actor: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        error: { type: string }
        events: { type: array, items: { type: object, additionalProperties: true } }
    RecordingInput:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/ArtifactName' }
        source: { type: string }
        target: { type: string }
