openapi: 3.1.0
info:
  title: Dispatch geocoder API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': { description: Ready }
  /locations:
    get:
      operationId: searchLocations
      parameters:
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200':
          description: Matching deterministic locations
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
  /locations/{code}:
    get:
      operationId: getLocation
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '404': { description: Unknown location }
components:
  schemas:
    Location:
      type: object
      required: [code, name, x, y, zone]
      properties:
        code: { type: string }
        name: { type: string }
        x: { type: number }
        y: { type: number }
        zone: { type: string }

