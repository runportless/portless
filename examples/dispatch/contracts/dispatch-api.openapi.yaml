openapi: 3.1.0
info:
  title: Dispatch operations API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /locations:
    get:
      operationId: searchLocations
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Matching locations
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
  /estimates:
    get:
      operationId: estimateDelivery
      parameters:
        - { name: pickup, in: query, required: true, schema: { type: string } }
        - { name: destination, in: query, required: true, schema: { type: string } }
        - { name: size, in: query, required: true, schema: { $ref: '#/components/schemas/ParcelSize' } }
        - { name: priority, in: query, required: true, schema: { $ref: '#/components/schemas/Priority' } }
      responses:
        '200':
          description: Deterministic estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /deliveries:
    get:
      operationId: listDeliveries
      responses:
        '200':
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                required: [provider, deliveries]
                properties:
                  provider: { type: string }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/Delivery' }
    post:
      operationId: createDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDelivery' }
      responses:
        '201':
          description: Scheduled delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^D-[0-9]+$' } }
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '404': { $ref: '#/components/responses/Error' }
  /deliveries/{deliveryId}/advance:
    post:
      operationId: advanceDelivery
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, pattern: '^D-[0-9]+$' } }
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Structured request failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      required: [service, ready, provider]
      properties:
        service: { const: api }
        ready: { type: boolean }
        provider: { type: string }
    ParcelSize: { type: string, enum: [small, medium, large] }
    Priority: { type: string, enum: [standard, express] }
    Status: { type: string, enum: [scheduled, assigned, picked_up, delivered] }
    Location:
      type: object
      required: [code, name, x, y, zone]
      properties:
        code: { type: string }
        name: { type: string }
        x: { type: number }
        y: { type: number }
        zone: { type: string }
    Estimate:
      type: object
      required: [pickup, destination, distanceKm, etaMinutes, priceCents, strategy]
      properties:
        pickup: { type: string }
        destination: { type: string }
        distanceKm: { type: number, minimum: 0 }
        etaMinutes: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 0 }
        strategy: { type: string }
    CreateDelivery:
      type: object
      required: [pickup, destination, parcelSize, priority]
      properties:
        pickup: { type: string }
        destination: { type: string }
        parcelSize: { $ref: '#/components/schemas/ParcelSize' }
        priority: { $ref: '#/components/schemas/Priority' }
    Delivery:
      allOf:
        - { $ref: '#/components/schemas/CreateDelivery' }
        - type: object
          required: [id, distanceKm, etaMinutes, priceCents, routeStrategy, status, createdAt, updatedAt]
          properties:
            id: { type: string, pattern: '^D-[0-9]+$' }
            distanceKm: { type: number }
            etaMinutes: { type: integer }
            priceCents: { type: integer }
            routeStrategy: { type: string }
            status: { $ref: '#/components/schemas/Status' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            dependency: { type: string }

